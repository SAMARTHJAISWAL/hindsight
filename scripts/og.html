<!doctype html>
<!-- Renders web/og.png (1200x630) with headless Chrome from a made-up sample
     card. Serve _site/ (with this file copied in) and screenshot it. -->
<meta charset="utf-8">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color: #efeaf8;
         background: radial-gradient(900px 500px at 15% 0%, #2a1650 0%, #0d0a16 65%);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: flex; align-items: center; }
  .left { flex: 1; padding-left: 70px; }
  .k { font: 700 28px ui-monospace, Menlo, monospace; color: #ff5fa2; margin: 0; }
  h1 { font-size: 66px; line-height: 1.02; letter-spacing: -0.03em; margin: 14px 0 20px; }
  p { font-size: 25px; color: #a39bb8; margin: 0 0 26px; max-width: 520px; }
  code { font: 22px ui-monospace, Menlo, monospace; color: #ffc857; background: #171226; border: 1px solid #2b2340; border-radius: 10px; padding: 10px 14px; }
  canvas { width: 432px; height: 540px; margin: 0 70px 0 0; border-radius: 16px; box-shadow: 0 30px 80px rgb(0 0 0 / .55); }
</style>
<div class="left">
  <p class="k">&gt;_ hindsight</p>
  <h1>Your year in<br>the terminal.</h1>
  <p>Top commands, your favourite typo, your busiest hour and your terminal personality. Private by design.</p>
  <code>npx github:SAMARTHJAISWAL/hindsight</code>
</div>
<canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
  import { drawCard } from "./card.js";
  drawCard(document.getElementById("c"), {
    v: 1, y: 2026, c: 12483, u: 214,
    top: [["git", 3102], ["npm", 1640], ["cd", 1288], ["docker", 911], ["vim", 604]],
    git: [["status", 812], ["commit", 640]],
    ty: [{ typo: "gti", meant: "git", n: 41 }], tt: 97,
    t: { h: 23, w: 2, s: 23, d: 211, n: 18, hs: [] },
    f: { sb: 12, rr: 8, cl: 340 }, ed: ["vim", 604],
    p: { name: "The Git Whisperer", tagline: "You and version control have an understanding." },
  });
  document.title = "ready";
</script>
